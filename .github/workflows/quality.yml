name: Quality and release gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Browser, catalog, public-site, and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --check app.js
      - run: node scripts/validate-catalog.mjs
      - run: node scripts/validate-cc0-research-catalog.mjs
      - run: node scripts/build-public-site.mjs
      - run: node scripts/scan-secrets.mjs
      - run: git diff --check
